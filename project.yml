name: Tidio
options:
  bundleIdPrefix: com.tidio
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
  xcodeVersion: "15.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  Tidio:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Sources
    resources:
      - path: Resources
        excludes:
          - "*.entitlements"
          - "Info.plist"
          - "Info-iOS.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tidio.app
        PRODUCT_NAME: Tidio
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_FILE: Resources/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Resources/Tidio.entitlements
    entitlements:
      path: Resources/Tidio.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.personal-information.photos-library: true
        com.apple.security.network.client: true
